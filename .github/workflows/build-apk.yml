name: Build SoccerStars Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate and extract source archive (if needed)
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f main.py || ! -f buildozer.spec ]]; then
            archive='SoccerStars-Android-Preview.zip'
            if [[ ! -f "$archive" && -f 'SoccerStars-Android-Preview-Fixed.zip' ]]; then
              archive='SoccerStars-Android-Preview-Fixed.zip'
            fi
            if [[ ! -f "$archive" ]]; then
              echo "ERROR: Source files are missing. Upload SoccerStars-Android-Preview.zip to the repository root, or commit main.py and buildozer.spec with source/assets."
              exit 1
            fi
            tmpdir=$(mktemp -d)
            unzip -q "$archive" -d "$tmpdir"
            source_root=$(find "$tmpdir" -type f -name main.py -printf '%h\n' | head -n 1)
            if [[ -z "$source_root" || ! -f "$source_root/buildozer.spec" ]]; then
              echo "ERROR: Archive does not contain a valid project root (main.py and buildozer.spec)."
              exit 1
            fi
            cp -a "$source_root/." .
          fi
          test -f main.py
          test -f buildozer.spec
          test -d assets/images
          test -d assets/sounds
      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv git zip unzip openjdk-17-jdk build-essential ccache libffi-dev libssl-dev zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake autoconf automake libtool pkg-config
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user buildozer cython==0.29.36
      - name: Pin Python to compatible 3.12 and stable p4a
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's|^requirements[[:space:]]*=.*|requirements = python3==3.12.9,hostpython3==3.12.9,pygame,numpy,pillow|' buildozer.spec
          if grep -qE '^p4a\.branch[[:space:]]*=' buildozer.spec; then
            sed -i -E 's|^p4a\.branch[[:space:]]*=.*|p4a.branch = master|' buildozer.spec
          else
            printf '\np4a.branch = master\n' >> buildozer.spec
          fi
          grep -nE '^(requirements|p4a\.branch)[[:space:]]*=' buildozer.spec
      - name: Set minimum Android API for NumPy
        shell: bash
        run: |
          if grep -qE '^android\.minapi[[:space:]]*=' buildozer.spec; then
            sed -i -E 's/^android\.minapi[[:space:]]*=.*/android.minapi = 24/' buildozer.spec
          else
            printf '\nandroid.minapi = 24\n' >> buildozer.spec
          fi
          grep -n '^android.minapi' buildozer.spec
      - name: Pin Android NDK to installed r27.3
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR="$ANDROID_HOME/ndk/27.3.13750724"
          test -d "$NDK_DIR"
          if grep -qE '^android.ndk[[:space:]]*=' buildozer.spec; then
            sed -i -E 's/^android\.ndk[[:space:]]*=.*/android.ndk = 27.3.13750724/' buildozer.spec
          else
            printf '\nandroid.ndk = 27.3.13750724\n' >> buildozer.spec
          fi
          echo "ANDROIDNDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          grep -n '^android.ndk' buildozer.spec
          echo "Pinned NDK directory: $NDK_DIR"
      - name: Prepare patched python-for-android source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kivy/python-for-android.git .p4a
          python3 - <<'PY'
          from pathlib import Path
          recipe = Path(".p4a/pythonforandroid/recipes/python3/__init__.py")
          source = recipe.read_text()
          patcher = '''

          # CI compatibility: Android Bionic lacks group enumeration functions.
          from pythonforandroid.recipes.python3 import Python3Recipe as _P3
          _original_apply_patches = _P3.apply_patches
          def _android_grp_compat(self, arch, build_dir=None):
              _original_apply_patches(self, arch, build_dir=build_dir)
              from pathlib import Path
              target = Path(build_dir or self.get_build_dir(arch.arch)) / "Modules" / "grpmodule.c"
              if not target.exists():
                  raise RuntimeError("CPython grpmodule.c missing after recipe patch stage")
              text = target.read_text()
              if "ANDROID_GRP_COMPAT_STUBS" not in text:
                  needle = "#include <grp.h>"
                  stubs = needle + "\\n/* ANDROID_GRP_COMPAT_STUBS: Bionic has no group enumeration APIs. */\\n#ifdef __ANDROID__\\nstatic void setgrent(void) { }\\nstatic struct group *getgrent(void) { return NULL; }\\nstatic void endgrent(void) { }\\n#endif"
                  if needle not in text:
                      raise RuntimeError("Could not find grp.h include to patch")
                  target.write_text(text.replace(needle, stubs, 1))
              print("Applied Android grp compatibility stubs to CPython.")
          _P3.apply_patches = _android_grp_compat
          '''
          if "ANDROID_GRP_COMPAT_STUBS" not in source:
              recipe.write_text(source + patcher)
          PY
          sed -i '/^p4a.source_dir[[:space:]]*=/d' buildozer.spec
          echo "p4a.source_dir = $GITHUB_WORKSPACE/.p4a" >> buildozer.spec
          echo "Configured Buildozer to use patched p4a at $GITHUB_WORKSPACE/.p4a"
          grep -F 'p4a.source_dir =' buildozer.spec
      - name: Override pygame recipe with compatible source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p4a-recipes/pygame
          cat > p4a-recipes/pygame/__init__.py <<'PY'
          from pythonforandroid.recipes.pygame import Pygame2Recipe

          class Pygame261Recipe(Pygame2Recipe):
              version = "2.6.1"
              url = "https://github.com/pygame/pygame/archive/refs/tags/{version}.tar.gz"
              hostpython_prerequisites = ["setuptools", "cython>=3.1"]

          recipe = Pygame261Recipe()
          PY
          if grep -qE '^p4a\.local_recipes[[:space:]]*=' buildozer.spec; then
            sed -i -E 's|^p4a\.local_recipes[[:space:]]*=.*|p4a.local_recipes = ./p4a-recipes|' buildozer.spec
          else
            printf '\np4a.local_recipes = ./p4a-recipes\n' >> buildozer.spec
          fi
          grep -n '^p4a.local_recipes' buildozer.spec
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          echo "NDK in use: $ANDROIDNDK"
          test -d "$ANDROIDNDK"
          ~/.local/bin/buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: SoccerStars-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
